name: Skirmish
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.1.0
      - name: Check economy, paths and packaging
        run: python -m unittest discover -s tests -v
      - name: Build skirmish
        run: python tools/build_skirmish.py
      - name: Check user-local installer
        run: |
          sh -n tools/install_skirmish.sh
          sh tools/install_skirmish.sh --dest "$RUNNER_TEMP/omarchy-test-maps"
          cmp build/omarchy-skirmish.oramap "$RUNNER_TEMP/omarchy-test-maps/omarchy-skirmish.oramap"
      - uses: actions/checkout@v4
        with:
          repository: OpenRA/OpenRA
          ref: release-20250330
          path: engine
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Install engine libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.1-0 libsdl2-2.0-0 libopenal1 libfreetype6 xvfb libgl1-mesa-dri libegl1
      - name: Build pinned OpenRA
        id: engine-build
        working-directory: engine
        run: |
          dotnet build -c Release -p:TargetPlatform=unix-generic
          ./configure-system-libraries.sh
      - name: Build the dedicated Omarchy mod and menu
        run: |
          dotnet build mod/OpenRA.Mods.Omarchy -c Release -p:EngineDir="$GITHUB_WORKSPACE/engine/bin" -o build/menu
          python tools/build_omarchy_mod.py engine build/menu/OpenRA.Mods.Omarchy.dll
      - name: Validate Omarchy-only menus and map catalog
        working-directory: engine
        env:
          TREAT_WARNINGS_AS_ERRORS: 'true'
        run: |
          export MOD_SEARCH_PATHS="$GITHUB_WORKSPACE/engine/mods,$GITHUB_WORKSPACE/build/mods"
          ./utility.sh omarchy --check-omarchy
          ./utility.sh omarchy --check-yaml
      - name: Publish self-contained Linux engine
        working-directory: engine
        run: dotnet publish -c Release -p:TargetPlatform=linux-x64 -p:CopyGenericLauncher=True -p:CopyCncDll=True -p:CopyD2kDll=False -r linux-x64 -p:PublishDir="$GITHUB_WORKSPACE/build/runtime" --self-contained true -m:1
      - name: Stage and verify the bundled Omarchy game
        run: |
          python tools/build_bundle.py engine build/runtime
          cd build/bundle
          export ENGINE_DIR="$PWD" MOD_SEARCH_PATHS="$PWD/mods" TREAT_WARNINGS_AS_ERRORS=true
          ./OpenRA.Utility omarchy --check-omarchy
          ./OpenRA.Utility omarchy --check-yaml
      - name: Smoke test the real bundled game client
        run: SDL_VIDEODRIVER=x11 xvfb-run -a python tools/smoke_bundle.py build/bundle
      - name: Build single-file installer
        run: |
          python tools/build_installer.py
          bash -n packaging/install.sh.in
          bash -n build/install-omarchy-edition.sh
          cd build && sha256sum --check install-omarchy-edition.sh.sha256
      - name: Install actual release into a clean home and verify it
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/omarchy clean home/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/omarchy clean home/config"
          bash build/install-omarchy-edition.sh --no-launch
          bash "$XDG_DATA_HOME/command-and-conquer-omarchy/launch.sh" --verify
      - name: Lint packaged skirmish against OpenRA
        working-directory: engine
        env:
          TREAT_WARNINGS_AS_ERRORS: 'true'
        run: ./utility.sh ra --check-yaml ../build/omarchy-skirmish.oramap
      - name: Decode and verify complete original roster with OpenRA
        if: ${{ !cancelled() && steps.engine-build.outcome == 'success' }}
        run: python tools/verify_openra_art.py engine build/omarchy-skirmish
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-skirmish
          path: |
            build/omarchy-skirmish.oramap
            build/install-omarchy-edition.sh
            build/install-omarchy-edition.sh.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: skirmish-art-previews
          path: |
            build/omarchy-skirmish/roster-preview.png
            build/omarchy-skirmish/icon-preview.png
            build/omarchy-skirmish/map.png
            build/omarchy-skirmish/art-manifest.json
  publish-preview:
    # Publish this immutable preview once, only after the complete validation job.
    # Later pushes leave the existing release and its assets untouched.
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/omarchy-skirmish'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: omarchy-skirmish
          path: preview
      - name: Publish Omarchy-only installer preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.0.1-preview.3
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Preview already exists; leaving its assets untouched."
            exit 0
          fi
          cd preview
          sha256sum --check install-omarchy-edition.sh.sha256
          cd ..
          gh release create "$tag" \
            preview/install-omarchy-edition.sh \
            preview/install-omarchy-edition.sh.sha256 \
            preview/omarchy-skirmish.oramap \
            --target "$GITHUB_SHA" --prerelease \
            --title 'Omarchy Edition — bundled engine and custom roster' \
            --notes-file packaging/PREVIEW-NOTES.md
