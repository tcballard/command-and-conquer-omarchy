name: Skirmish
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.1.0
      - name: Check economy, paths and packaging
        run: python -m unittest discover -s tests -v
      - name: Build skirmish
        run: python tools/build_skirmish.py
      - uses: actions/checkout@v4
        with:
          repository: OpenRA/OpenRA
          ref: release-20250330
          path: engine
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Install engine libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.1-0 libsdl2-2.0-0 libopenal1 libfreetype6
      - name: Build pinned OpenRA
        working-directory: engine
        run: |
          dotnet build -c Release -p:TargetPlatform=unix-generic
          ./configure-system-libraries.sh
      - name: Lint packaged skirmish against OpenRA
        working-directory: engine
        env:
          TREAT_WARNINGS_AS_ERRORS: 'true'
        run: ./utility.sh ra --check-yaml ../build/omarchy-skirmish.oramap
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-skirmish
          path: build/omarchy-skirmish.oramap
