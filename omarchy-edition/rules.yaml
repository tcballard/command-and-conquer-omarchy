Player:
	PlayerResources:
		DefaultCash: 1500
	ModularBot@CampaignAI:
		Name: commie-bot.name

World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, omarchy.lua
	MissionData:
		Briefing: Comrade DHH has fled. The Central Planning Compositor has decreed that all windows shall float, and the Five-Year Plan that makes it permanent completes in thirty minutes.\n\nEstablish the ISO, sync your packages, and destroy the Compositor before then. Destroying the Five-Year Plan itself cancels the clock.\n\nThe Commies hold the far side of the river. One ford, one pontoon bridge. Both are watched. This isn't a grab bag of preinstalled units: zero bloat, just everything you need.
	Faction@allies:
		Name: faction-omarchians.name
	Faction@soviet:
		Name: faction-commies.name
	TimeLimitManager:
		CountdownLabel: MISSION_TEXT
		CountdownText: Five-Year Plan completes in {0}
		Notification: {0} minute{1} until all windows float
		SkipTimerExpiredNotification: True

